<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Vision Analyzer</title>

    <link rel="stylesheet"href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <header>
            <h1>AI Vision Analyzer</h1>

            <p>
                Image Classification & Object Detection System
            </p>
        </header>


        <div class="upload-card">

            <h2>Upload an Image</h2>

            <p>
                Upload an image and let AI detect objects automatically.
            </p>

            <div class="model-select-wrapper" style="margin: 15px auto; max-width: 380px; text-align: left;">
                <label for="modelSelect" style="font-weight: 600; font-size: 14px; display: block; margin-bottom: 6px;">
                    Select AI Detection Model:
                </label>
                <select id="modelSelect" style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; background: #fff; cursor: pointer;">
                    <option value="yolo" selected>⚡ YOLOv8 (Ultra Fast)</option>
                    <option value="faster_rcnn">🎯 Faster R-CNN (ResNet-50 FPN)</option>
                </select>
            </div>

            <input
                type="file"
                id="imageInput"
                accept="image/png, image/jpeg, image/jpg"
            >

            <button id="analyzeBtn">
                Analyze Image
            </button>

            <p id="status"></p>

        </div>


        <div
            class="results"
            id="results"
            style="display: none;"
        >

            <div class="image-section">

                <h2>Detection Result</h2>

                <img
                    id="resultImage"
                    src=""
                    alt="Detection Result"
                >

            </div>


            <div class="details-section">

                <div class="stat-card">

                    <h3>Total Objects</h3>

                    <span id="totalObjects">
                        0
                    </span>

                </div>


                <h2>Detected Objects</h2>

                <div id="detectionList"></div>

            </div>

        </div>

    </div>


    <script
        src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>

</html>
